# =====================================================================
# DEV profile (default): in-memory H2. Safe: never connects to Neon/Postgres.
# Data is wiped on every restart; the demo account is re-seeded.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:finora;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;NON_KEYWORDS=MONTH,YEAR,VALUE,KEY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# H2 console stays off: it registers a second servlet, which breaks Spring Security's String path matchers.
spring.h2.console.enabled=false

# Seed demo@finance.com / Demo@1234 with 4 months of sample data (labelled demo account)
app.seed.enabled=${SEED_DEMO_DATA:true}
