# =====================================================================
# PROD profile: PostgreSQL (e.g. Neon). Activate with SPRING_PROFILES_ACTIVE=prod
# All values come from environment variables - there are deliberately no defaults.
# =====================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# 'validate' never alters the schema. Switch to 'update' consciously if you need Hibernate to add columns.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.h2.console.enabled=false
app.seed.enabled=${SEED_DEMO_DATA:false}
