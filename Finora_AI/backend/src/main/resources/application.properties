# =====================================================================
# Finora AI - Spring Boot configuration (shared by all profiles)
# NO SECRETS IN THIS FILE. Every secret comes from an environment
# variable, or from an optional, git-ignored `.env` file in the project
# root (../.env when started from backend/) or in backend/ itself.
# See .env.example in the project root.
#
# Profiles:
#   dev  (default) -> in-memory H2 database + demo data. Never touches Neon/Postgres.
#   prod           -> PostgreSQL from DB_URL / DB_USERNAME / DB_PASSWORD (application-prod.properties)
# =====================================================================
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.application.name=finora-backend
server.port=${PORT:8080}

# JSON uses snake_case (the React app maps it to camelCase)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Security ---
# Min. 32 characters. If empty, a random key is generated per process (dev only: sessions end on restart).
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma-separated allowed browser origins (patterns allowed, e.g. https://*.trycloudflare.com)
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}

# --- API docs / ops ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
management.endpoints.web.exposure.include=health,info

# --- AI coach (OpenAI-compatible API, e.g. Groq) ---
# Disabled unless AI_ENABLED=true and AI_API_KEY is set. When disabled the coach says so explicitly.
ai.enabled=${AI_ENABLED:false}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:openai/gpt-oss-120b}
ai.base-url=${AI_BASE_URL:https://api.groq.com/openai}
# Spring AI auto-configuration needs a non-empty key to start; the placeholder is never used for calls.
spring.ai.openai.api-key=${AI_API_KEY:not-configured}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${AI_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=${AI_TEMPERATURE:0.3}

# --- App ---
app.name=Finora AI API
app.environment=${APP_ENV:development}
# Startup demo seed (demo@finance.com) - only runs when the users table is empty.
app.seed.enabled=${SEED_DEMO_DATA:false}

